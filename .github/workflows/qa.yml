name: QA

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qa:
    name: qa (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifests and provider contracts
        run: npm run validate

      - name: Test
        run: npm test
