    <text x="70" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#8b949e">Allowlist: read_file,list_dir</text>
    <text x="70" y="67" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#6e7681">Schema: --json-schema (inline)</text>
  </g>

