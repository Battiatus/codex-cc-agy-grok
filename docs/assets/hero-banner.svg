<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" role="img" aria-label="Polyglot Agent Connectors — Cross-Agent CLI Bridge for Claude Code, OpenAI Codex, xAI Grok, and Google Antigravity">
  <defs>
