    <circle cx="24" cy="11" r="1.8" fill="#e6edf3" />
    <circle cx="10" cy="23" r="1.8" fill="#3fb950" />
    <circle cx="24" cy="23" r="1.8" fill="#58a6ff" />

    <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f0f6fc" letter-spacing="-0.6">
      Polyglot Agent Connectors
    </text>
