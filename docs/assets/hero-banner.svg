      <text x="150" y="0" fill="#8b949e">Git-scoped diff &amp; live --stream</text>
      <line x1="0" y1="12" x2="344" y2="12" stroke="#21262d" stroke-width="1" />

      <!-- Row 2 -->
      <text x="0" y="33" fill="#d29922" font-weight="600">adversarial-review</text>
      <text x="150" y="33" fill="#8b949e">Red Team security &amp; edge audit</text>
      <line x1="0" y1="45" x2="344" y2="45" stroke="#21262d" stroke-width="1" />

      <!-- Row 3 -->
      <text x="0" y="66" fill="#3fb950" font-weight="600">rescue</text>
      <text x="150" y="66" fill="#8b949e">Write fix + git stash rollbackRef</text>
      <line x1="0" y1="78" x2="344" y2="78" stroke="#21262d" stroke-width="1" />

      <!-- Row 4 -->
      <text x="0" y="99" fill="#c9d1d9" font-weight="600">runs / status</text>
      <text x="150" y="99" fill="#8b949e">Unified PID, log tail &amp; --follow</text>
