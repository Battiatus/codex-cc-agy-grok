    <line x1="10" y1="11" x2="24" y2="23" stroke="#30363d" stroke-width="1.2" />
    <line x1="24" y1="11" x2="10" y2="23" stroke="#30363d" stroke-width="1.2" />
    <circle cx="17" cy="17" r="2.8" fill="#3fb950" />
