    <text x="580" y="26" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e">
      <tspan fill="#3fb950">●</tspan> JSON Schema Validated   <tspan fill="#58a6ff">●</tspan> Worktree Isolation   <tspan fill="#c9d1d9">●</tspan> Zero Credential Storage
