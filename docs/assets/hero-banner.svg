    <circle cx="788" cy="216" r="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="788" cy="260" r="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" />

